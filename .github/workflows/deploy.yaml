name: Deploy

# Same shape as log-studio and tbre-website, minus the build: the repo root is already
# the site. Needs the organisation secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# See tbre-ai/team-knowledge/processes -> Web Development/Deploying with Cloudflare.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://join.teambathracingelectric.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy

      - name: Explain why nothing was deployed
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not readable from this repository, so nothing was deployed. Add this repo to the organisation secrets' repository list."
